name: behavior_bridge
description: "BehaviorBridge — evidence-based behavior tracking for parents and teachers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_hooks: ^0.21.2
  hooks_riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  go_router: ^15.1.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10

  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4

  intl: ^0.20.2
  logger: ^2.6.1
  uuid: ^4.4.2
  collection: ^1.18.0
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  build_runner: ^2.4.6
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  mocktail: 1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/clients/default/
    - assets/clients/default/images/
    - assets/fixtures/
